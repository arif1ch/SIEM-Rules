title: QRadar - Privilege Escalation via Group Membership Modification
id: qradar-rule-007
status: experimental
description: Detects security group modifications where accounts are added to high-privilege administrative groups.
references:
  - https://attack.mitre.org/techniques/T1098/
tags:
  - attack.privilege_escalation
  - attack.t1098
logsource:
  category: directory_service
detection:
  selection:
    eventname: 'Member Added to Group'
  condition: selection
qradar_aql: |
  SELECT sourceip, username, eventname, target_username 
  FROM events 
  WHERE eventname ILIKE '%Member Added to Group%' OR eventname ILIKE '%Group Modified%' 
  GROUP BY sourceip, username, eventname, target_username
