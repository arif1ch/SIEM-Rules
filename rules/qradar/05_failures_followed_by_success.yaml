title: QRadar - Multiple Failures Followed by Success
id: qradar-rule-005
status: experimental
description: Detects successful login immediately following multiple authentication failures for the same user.
references:
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.initial_access
  - attack.t1110
logsource:
  category: authentication
detection:
  sequence:
    - event: failure
    - event: success
  condition: sequence
qradar_aql: |
  SELECT sourceip, username, 
         sum(case when lowercased(status)='failure' then 1 else 0 end) as failures,
         sum(case when lowercased(status)='success' then 1 else 0 end) as successes 
  FROM events 
  WHERE categoryname ILIKE '%Authentication%' 
  GROUP BY sourceip, username 
  HAVING failures > 3 AND successes > 0
