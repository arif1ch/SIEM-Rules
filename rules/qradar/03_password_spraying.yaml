title: QRadar - Password Spraying Attack
id: qradar-rule-003
status: experimental
description: Detects password spraying where a single source IP attempts logins across many distinct user accounts.
references:
  - https://attack.mitre.org/techniques/T1110/003/
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  category: authentication
detection:
  selection:
    status: 'Failure'
  condition: unique username > 5 grouped by sourceip
qradar_aql: |
  SELECT sourceip, COUNT(DISTINCT username) as target_users 
  FROM events 
  WHERE lowercase(status) = 'failure' OR categoryname ILIKE '%Login Failed%' 
  GROUP BY sourceip 
  HAVING target_users > 5 
  ORDER BY target_users DESC
