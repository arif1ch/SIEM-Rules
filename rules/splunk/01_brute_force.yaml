title: Multiple Failed Logins Followed By Success (Potential Brute Force)
id: splunk-rule-001
status: experimental
description: Detects multiple failed authentication attempts followed by a successful login from the same user or source IP.
references:
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.initial_access
  - attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection_failed:
    EventCode: 4625
  selection_success:
    EventCode: 4624
  timeframe: 5m
  condition: selection_failed | count by User, SrcIP > 5 followed by selection_success
splunk_spl: |
  index=windows sourcetype=WinEventLog:Security (EventCode=4625 OR EventCode=4624) 
  | stats count(eval(EventCode=4625)) as failed_count, count(eval(EventCode=4624)) as success_count by user, src_ip 
  | where failed_count > 5 AND success_count > 0
