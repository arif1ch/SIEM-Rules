title: Scheduled Task Creation or Modification
id: splunk-rule-015
status: experimental
description: Detects the creation of scheduled tasks using schtasks.exe for persistence.
references:
  - https://attack.mitre.org/techniques/T1053/005/
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventCode: 1
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
      - '/create'
  condition: selection
splunk_spl: |
  index=windows sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 
  Image="*\\schtasks.exe" CommandLine="*/create*"
  | table _time, Computer, User, CommandLine
