title: Access or Dumping of SAM and SYSTEM Registry Hives
id: splunk-rule-013
status: experimental
description: Detects suspicious attempts to access or export SAM and SYSTEM hives for offline credential cracking.
references:
  - https://attack.mitre.org/techniques/T1003/002/
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventCode: 1
    CommandLine|contains:
      - 'save hklm\sam'
      - 'save hklm\system'
      - 'vssadmin create shadow'
  condition: selection
splunk_spl: |
  index=windows sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 
  (CommandLine="*save hklm\\sam*" OR CommandLine="*save hklm\\system*" OR CommandLine="*vssadmin create shadow*")
  | table _time, Computer, User, CommandLine
