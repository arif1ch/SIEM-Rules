title: Disable Windows Firewall via Netsh
id: splunk-rule-014
status: experimental
description: Detects execution of netsh commands aimed at disabling the Windows firewall.
references:
  - https://attack.mitre.org/techniques/T1562/004/
tags:
  - attack.defense_evasion
  - attack.t1562.004
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventCode: 1
    Image|endswith: '\netsh.exe'
    CommandLine|contains:
      - 'firewall set opmode disable'
      - 'advfirewall set allprofiles state off'
  condition: selection
splunk_spl: |
  index=windows sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 
  Image="*\\netsh.exe" (CommandLine="*firewall set opmode disable*" OR CommandLine="*advfirewall set allprofiles state off*")
  | table _time, Computer, User, CommandLine
